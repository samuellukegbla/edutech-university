        status_display:
          type: string
          readOnly: true
        enrollment_date:
          type: string
          format: date
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_session
      - academic_session_name
      - application
      - application_number
      - created_at
      - enrollment_date
      - id
      - programme
      - programme_name
      - semester
      - semester_name
      - status_display
      - student_id
      - student_name
      - updated_at
    EnrollmentStatusEnum:
      enum:
      - ACTIVE
      - DEFERRED
      - SUSPENDED
      - WITHDRAWN
      - GRADUATED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `DEFERRED` - Deferred
        * `SUSPENDED` - Suspended
        * `WITHDRAWN` - Withdrawn
        * `GRADUATED` - Graduated
    Faculty:
      type: object
