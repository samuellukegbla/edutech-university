components:
  schemas:
    AcademicSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: 'Example: 2026/2027'
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - name
      - start_date
      - updated_at
    AdmissionDecision:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        application:
          type: string
          format: uuid
        application_number:
          type: string
          readOnly: true
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        decision_display:
          type: string
          readOnly: true
        review_comments:
          type: string
        reviewed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reviewed_by_username:
          type: string
          readOnly: true
        decision_date:
          type: string
          format: date-time
          readOnly: true
        offer_letter_generated:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - application
      - application_number
      - created_at
      - decision
      - decision_date
      - decision_display
      - id
      - reviewed_by
      - reviewed_by_username
      - updated_at
    ApplicationDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        application:
          type: string
          format: uuid
        application_number:
          type: string
          readOnly: true
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        document_type_display:
          type: string
          readOnly: true
        file:
          type: string
          format: uri
        description:
          type: string
          maxLength: 255
        verified:
          type: boolean
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - application
      - application_number
      - created_at
      - document_type
      - document_type_display
      - file
      - id
      - updated_at
      - verified_at
    BlankEnum:
      enum:
      - ''
    BloodGroupEnum:
      enum:
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      - O+
      - O-
      type: string
      description: |-
        * `A+` - A+
        * `A-` - A-
        * `B+` - B+
        * `B-` - B-
        * `AB+` - AB+
        * `AB-` - AB-
        * `O+` - O+
        * `O-` - O-
    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 20
        title:
          type: string
          maxLength: 200
        description:
          type: string
        department:
          type: string
          format: uuid
        department_name:
          type: string
          readOnly: true
        programme:
          type: string
          format: uuid
        programme_name:
          type: string
          readOnly: true
        credit_hours:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          minimum: 0
          maximum: 9223372036854775807
        semester:
          $ref: '#/components/schemas/SemesterEnum'
        course_type:
          $ref: '#/components/schemas/CourseTypeEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - credit_hours
      - department
      - department_name
      - id
      - level
      - programme
      - programme_name
      - semester
      - title
      - updated_at
    CourseRegistration:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        enrollment:
          type: string
          format: uuid
        student_id:
          type: string
          readOnly: true
        course_offering:
          type: string
          format: uuid
        course_code:
          type: string
          readOnly: true
        course_title:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/CourseRegistrationStatusEnum'
        registered_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course_code
      - course_offering
      - course_title
      - created_at
      - enrollment
      - id
      - registered_at
      - student_id
      - updated_at
    CourseRegistrationStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - DROPPED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `DROPPED` - Dropped
        * `REJECTED` - Rejected
    CourseTypeEnum:
      enum:
      - CORE
      - ELECTIVE
      type: string
      description: |-
        * `CORE` - Core
        * `ELECTIVE` - Elective
    DecisionEnum:
      enum:
      - ACCEPTED
      - REJECTED
      - WAITLISTED
      - DEFERRED
      type: string
      description: |-
        * `ACCEPTED` - Accepted
        * `REJECTED` - Rejected
        * `WAITLISTED` - Waitlisted
        * `DEFERRED` - Deferred
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 150
        description:
          type: string
        faculty:
          type: string
          format: uuid
        faculty_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - faculty
      - faculty_name
      - id
      - name
      - updated_at
    DocumentTypeEnum:
      enum:
      - PASSPORT
      - NATIONAL_ID
      - BIRTH_CERTIFICATE
      - WASSCE
      - TRANSCRIPT
      - RECOMMENDATION
      - OTHER
      type: string
      description: |-
        * `PASSPORT` - Passport Photograph
        * `NATIONAL_ID` - National ID
        * `BIRTH_CERTIFICATE` - Birth Certificate
        * `WASSCE` - WASSCE/WAEC Result
        * `TRANSCRIPT` - Academic Transcript
        * `RECOMMENDATION` - Recommendation Letter
        * `OTHER` - Other
    Enrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        application:
          type: string
          format: uuid
        application_number:
          type: string
          readOnly: true
        student_id:
          type: string
          readOnly: true
        student_name:
          type: string
          readOnly: true
        programme:
          type: string
          format: uuid
        programme_name:
          type: string
          readOnly: true
        academic_session:
          type: string
          format: uuid
        academic_session_name:
          type: string
          readOnly: true
        semester:
          type: string
          format: uuid
        semester_name:
          type: string
          readOnly: true
        status:
